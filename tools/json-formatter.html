<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>JSON Formatter — RunExe Technology</title>
<meta name="description" content="Format, validate, and minify JSON in your browser. Nothing is sent to a server." />
<link rel="icon" type="image/png" href="../assets/runexe-logo.png" />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script>
(function(){
  try {
    var stored = localStorage.getItem('runexe-theme');
    var theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
  } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
})();
</script>
<style>
:root{--bg:#FAFAFA;--bg-2:#fff;--crimson:#8B1A1A;--ink:#111;--ink-60:rgba(17,17,17,.6);--line:rgba(17,17,17,.08);--mono:'IBM Plex Mono',Menlo,monospace}
html[data-theme="dark"]{--bg:#0B0B0B;--bg-2:#161616;--crimson:#D45C5C;--ink:#F3F1EE;--ink-60:rgba(243,241,238,.62);--line:rgba(255,255,255,.1)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left));padding-top:max(14px,env(safe-area-inset-top));border-bottom:1px solid var(--line);background:var(--bg-2)}
.bar a:first-child{min-width:0}
.bar img{height:36px;width:auto;max-width:min(180px,48vw);object-fit:contain}
.bar a.back{font-size:.82rem;font-weight:600;color:var(--crimson);flex:none;min-height:44px;display:inline-flex;align-items:center}
.wrap{max-width:1100px;margin:0 auto;padding:36px 22px calc(48px + env(safe-area-inset-bottom))}
h1{font-family:Sora,sans-serif;font-size:clamp(1.55rem,3vw,2.2rem);margin:8px 0 8px;overflow-wrap:anywhere}
.lead{color:var(--ink-60);margin-bottom:22px;max-width:560px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--bg-2);color:var(--ink);border-radius:10px;padding:10px 16px;font-weight:600;font-size:.85rem;min-height:44px}
button.primary{background:var(--crimson);border-color:var(--crimson);color:#fff}
textarea{width:100%;min-height:min(420px,58dvh);border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--bg-2);color:var(--ink);font-family:var(--mono);font-size:16px;line-height:1.55;resize:vertical}
.status{margin-top:12px;font-size:.82rem;font-weight:600;overflow-wrap:anywhere}
.status.ok{color:#2f9e44}
.status.err{color:var(--crimson)}
@media (max-width:560px){
  .wrap{padding:22px 14px calc(36px + env(safe-area-inset-bottom))}
  .actions{display:grid;grid-template-columns:1fr 1fr}
  .actions button.primary{grid-column:1 / -1}
  textarea{border-radius:12px;padding:12px}
}
</style>
</head>
<body>
  <div class="bar">
    <a href="../"><img class="logo-light" src="../assets/logo-trimmed.png" alt="RunExe Technology" /><img class="logo-dark" src="../assets/logo-trimmed-dark.png" alt="" style="display:none" /></a>
    <a class="back" href="../#tools">← Tools</a>
  </div>
  <div class="wrap">
    <div style="font-size:.68rem;font-weight:600;letter-spacing:.35em;text-transform:uppercase;color:var(--crimson)">Open source</div>
    <h1>JSON Formatter</h1>
    <p class="lead">Paste JSON, then format, minify, or validate. Everything stays in this tab — nothing is uploaded.</p>
    <div class="actions">
      <button class="primary" type="button" id="fmt">Format</button>
      <button type="button" id="min">Minify</button>
      <button type="button" id="val">Validate</button>
      <button type="button" id="cpy">Copy</button>
      <button type="button" id="clr">Clear</button>
    </div>
    <textarea id="src" spellcheck="false" placeholder='{ "hello": "runexe" }'></textarea>
    <div class="status" id="st"></div>
  </div>
<script>
(function(){
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.querySelector('.logo-light').style.display = dark ? 'none' : 'block';
  document.querySelector('.logo-dark').style.display = dark ? 'block' : 'none';
  var src = document.getElementById('src');
  var st = document.getElementById('st');
  function parse(){
    try { return { ok:true, data: JSON.parse(src.value) }; }
    catch(e){ return { ok:false, err: e.message }; }
  }
  function set(ok, msg){ st.className = 'status ' + (ok?'ok':'err'); st.textContent = msg; }
  document.getElementById('fmt').onclick = function(){
    var r = parse(); if(!r.ok) return set(false, r.err);
    src.value = JSON.stringify(r.data, null, 2); set(true, 'Formatted.');
  };
  document.getElementById('min').onclick = function(){
    var r = parse(); if(!r.ok) return set(false, r.err);
    src.value = JSON.stringify(r.data); set(true, 'Minified.');
  };
  document.getElementById('val').onclick = function(){
    var r = parse(); set(r.ok, r.ok ? 'Valid JSON.' : r.err);
  };
  document.getElementById('cpy').onclick = function(){
    navigator.clipboard.writeText(src.value).then(function(){ set(true, 'Copied.'); });
  };
  document.getElementById('clr').onclick = function(){ src.value=''; st.textContent=''; };
})();
</script>
</body>
</html>
